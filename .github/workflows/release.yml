name: Release

# 触发条件：推送 tag
#   v*     → 稳定版 Release（v0.2.0）
#   pre-*  → Pre-release（pre-0.2.0-rc1）
on:
  push:
    tags:
      - 'v*'
      - 'pre-*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: sweety
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ═══════════════════════════════════════════
          # Linux musl（静态链接，单文件部署）
          # ═══════════════════════════════════════════
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            artifact: sweety-linux-amd64-musl
            cross: false

          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            artifact: sweety-linux-aarch64-musl
            cross: true

          # ═══════════════════════════════════════════
          # Linux gnu（动态链接）
          # ═══════════════════════════════════════════
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: sweety-linux-amd64-gnu
            cross: false

          - target: i686-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: sweety-linux-i686-gnu
            cross: true

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: sweety-linux-aarch64-gnu
            cross: true

          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-24.04
            artifact: sweety-linux-armv7-gnu
            cross: true

          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: sweety-linux-riscv64-gnu
            cross: true

          # ═══════════════════════════════════════════
          # FreeBSD
          # ═══════════════════════════════════════════
          - target: x86_64-unknown-freebsd
            os: ubuntu-24.04
            artifact: sweety-freebsd-amd64
            cross: true

          # ═══════════════════════════════════════════
          # Windows
          # ═══════════════════════════════════════════
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: sweety-windows-amd64
            cross: false

          - target: i686-pc-windows-msvc
            os: windows-latest
            artifact: sweety-windows-i686
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── 依赖安装 ────────────────────────────────────
      - name: Install musl-tools (native musl)
        if: matrix.target == 'x86_64-unknown-linux-musl' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Install cmake (Linux)
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y cmake

      # i686 Windows 需要额外 target
      - name: Add i686 target (Windows)
        if: matrix.target == 'i686-pc-windows-msvc'
        run: rustup target add i686-pc-windows-msvc

      # ── 构建 ──────────────────────────────────────
      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      # ── 重命名可执行文件 ─────────────────────────────
      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe" "${{ matrix.artifact }}.exe"

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.exe
          if-no-files-found: error

  # ═══════════════════════════════════════════════════
  # 发布到 GitHub Releases
  # ═══════════════════════════════════════════════════
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum * 2>/dev/null | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine release type
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == pre-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=Pre-release $TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#pre-}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == v* ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=Release $TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=Release $TAG" >> "$GITHUB_OUTPUT"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes (CHANGELOG + compare)
        id: notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(git tag -l 'pre-*' 'v*' --sort=-v:refname)
          PREV=""
          for i in "${!tags[@]}"; do
            if [[ "${tags[$i]}" == "$TAG" ]] && (( i + 1 < ${#tags[@]} )); then
              PREV="${tags[$i + 1]}"
              break
            fi
          done

          SECTION_FILE="$RUNNER_TEMP/changelog-section.md"
          : > "$SECTION_FILE"
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="$VERSION" '
              BEGIN { found=0 }
              /^## \[/ {
                if (found) { exit }
                if ($0 ~ "\\[" ver "\\]") { found=1; next }
              }
              found { print }
            ' CHANGELOG.md > "$SECTION_FILE"
          fi

          BODY_FILE="$RUNNER_TEMP/release-body.md"
          {
            echo "## 更新日志"
            echo
            if [[ -s "$SECTION_FILE" ]]; then
              cat "$SECTION_FILE"
            else
              echo "_（CHANGELOG.md 中未找到 ## [$VERSION]，以下为 commit 摘要）_"
              echo
              if [[ -n "$PREV" ]]; then
                git log --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
              else
                git log --pretty=format:'- %s (%h)' -n 50
              fi
            fi
            echo
            echo "---"
            echo
            if [[ -n "$PREV" ]]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
            else
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${TAG}"
            fi
            echo
            echo "二进制包见下方 Assets；校验和见 \`SHA256SUMS.txt\`。"
          } > "$BODY_FILE"
          echo "path=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
          files: |
            artifacts/*
