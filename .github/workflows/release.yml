name: Release

# Tag push → GitHub Release + 多平台二进制
#   v*     稳定版
#   pre-*  预发布
# 产物命名见 .github/RELEASE.md
on:
  push:
    tags:
      - 'v*'
      - 'pre-*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: sweety
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ── 主矩阵：任一失败则不发版 ─────────────────────────────────────
  build-primary:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux musl（推荐生产部署）
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: sweety-linux-amd64-musl
            cross: false
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            artifact: sweety-linux-aarch64-musl
            cross: true
          - os: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            artifact: sweety-linux-armv7-musl
            cross: true
          - os: ubuntu-24.04
            target: i686-unknown-linux-musl
            artifact: sweety-linux-i686-musl
            cross: true

          # Linux gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: sweety-linux-amd64-gnu
            cross: false
          - os: ubuntu-24.04
            target: i686-unknown-linux-gnu
            artifact: sweety-linux-i686-gnu
            cross: true
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact: sweety-linux-aarch64-gnu
            cross: true
          - os: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            artifact: sweety-linux-armv7-gnu
            cross: true
          - os: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            artifact: sweety-linux-riscv64-gnu
            cross: true

          # macOS
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: sweety-macos-aarch64
            cross: false
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: sweety-macos-amd64
            cross: false

          # FreeBSD
          - os: ubuntu-24.04
            target: x86_64-unknown-freebsd
            artifact: sweety-freebsd-amd64
            cross: true

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sweety-windows-amd64
            cross: false
          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact: sweety-windows-i686
            cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: sweety-windows-aarch64
            cross: false

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-release
        with:
          target: ${{ matrix.target }}
          artifact: ${{ matrix.artifact }}
          cross: ${{ matrix.cross }}

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.exe
          if-no-files-found: error

  # ── 扩展矩阵：尽力构建，失败不阻断发版 ───────────────────────────
  build-secondary:
    name: ${{ matrix.artifact }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: powerpc64le-unknown-linux-gnu
            artifact: sweety-linux-ppc64le-gnu
            cross: true
          - target: s390x-unknown-linux-gnu
            artifact: sweety-linux-s390x-gnu
            cross: true
          - target: x86_64-unknown-netbsd
            artifact: sweety-netbsd-amd64
            cross: true

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-release
        with:
          target: ${{ matrix.target }}
          artifact: ${{ matrix.artifact }}
          cross: ${{ matrix.cross }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-primary, build-secondary]
    if: ${{ always() && needs.build-primary.result == 'success' && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum * 2>/dev/null | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate RELEASE_ASSETS.md
        run: |
          cd artifacts
          {
            echo "## 预编译包"
            echo
            echo "| 文件 | 平台 |"
            echo "|------|------|"
            for f in sweety-*; do
              [[ "$f" == "SHA256SUMS.txt" ]] && continue
              case "$f" in
                sweety-linux-*-musl) plat="Linux musl" ;;
                sweety-linux-*-gnu) plat="Linux glibc" ;;
                sweety-macos-aarch64) plat="macOS Apple Silicon" ;;
                sweety-macos-amd64) plat="macOS Intel" ;;
                sweety-freebsd-*) plat="FreeBSD" ;;
                sweety-netbsd-*) plat="NetBSD" ;;
                sweety-windows-*.exe) plat="Windows" ;;
                *) plat="—" ;;
              esac
              echo "| \`$f\` | $plat |"
            done
            echo
            echo "校验和：\`SHA256SUMS.txt\`"
          } > RELEASE_ASSETS.md

      - name: Determine release type
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == pre-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=Pre-release $TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#pre-}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == v* ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=Release $TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=Release $TAG" >> "$GITHUB_OUTPUT"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes (CHANGELOG + compare)
        id: notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(git tag -l 'pre-*' 'v*' --sort=-v:refname)
          PREV=""
          for i in "${!tags[@]}"; do
            if [[ "${tags[$i]}" == "$TAG" ]] && (( i + 1 < ${#tags[@]} )); then
              PREV="${tags[$i + 1]}"
              break
            fi
          done

          SECTION_FILE="$RUNNER_TEMP/changelog-section.md"
          : > "$SECTION_FILE"
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="$VERSION" '
              BEGIN { found=0 }
              /^## \[/ {
                if (found) { exit }
                if ($0 ~ "\\[" ver "\\]") { found=1; next }
              }
              found { print }
            ' CHANGELOG.md > "$SECTION_FILE"
          fi

          BODY_FILE="$RUNNER_TEMP/release-body.md"
          {
            echo "## 更新日志"
            echo
            if [[ -s "$SECTION_FILE" ]]; then
              cat "$SECTION_FILE"
            else
              echo "_（CHANGELOG.md 中未找到 ## [$VERSION]，以下为 commit 摘要）_"
              echo
              if [[ -n "$PREV" ]]; then
                git log --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
              else
                git log --pretty=format:'- %s (%h)' -n 50
              fi
            fi
            echo
            if [[ -f artifacts/RELEASE_ASSETS.md ]]; then
              cat artifacts/RELEASE_ASSETS.md
            fi
            echo
            echo "---"
            echo
            if [[ -n "$PREV" ]]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
            else
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${TAG}"
            fi
            echo
            echo "扩展架构（ppc64le / s390x / netbsd）在 **build-secondary** 中尽力构建，可能未出现在 Assets 中。"
          } > "$BODY_FILE"
          echo "path=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
          files: |
            artifacts/*
