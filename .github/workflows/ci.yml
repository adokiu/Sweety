name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-smoke:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: sweety-linux-amd64-musl
            cross: false
          - label: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            artifact: sweety-macos-aarch64
            cross: false
          - label: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sweety-windows-amd64
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/build-release
        with:
          target: ${{ matrix.target }}
          artifact: ${{ matrix.artifact }}
          cross: ${{ matrix.cross }}

      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        run: |
          file "${{ matrix.artifact }}"
          ls -lh "${{ matrix.artifact }}"

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-Item "${{ matrix.artifact }}.exe" | Format-List
