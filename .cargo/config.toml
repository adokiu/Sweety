# musl 交叉：配合 `cargo zigbuild --target x86_64-unknown-linux-musl`（Zig 作 linker/cc，无 Docker）
# jemalloc / aws-lc-sys 等 build.rs 由 cargo-zigbuild 注入 zig cc -target x86_64-linux-musl
[target.x86_64-unknown-linux-musl]
linker = "zig"
rustflags = [
  "-C", "link-arg=-target",
  "-C", "link-arg=x86_64-linux-musl",
]

# CPU 指令集优化（暂时禁用，本地 native 编译收益有限）
# 如需本机最大性能，取消下方注释或在编译时传 RUSTFLAGS="-C target-cpu=native"
#
# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "target-cpu=x86-64-v2"]
#
# [target.x86_64-apple-darwin]
# rustflags = ["-C", "target-cpu=x86-64-v2"]
#
# [target.aarch64-unknown-linux-gnu]
# rustflags = ["-C", "target-cpu=native"]
